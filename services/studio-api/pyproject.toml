[project]
name = "mira-studio-api"
version = "0.1.0"
description = "Mira Studio Path local API (studio-core)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "edge-tts>=6.1.0",
]

[project.scripts]
mira-studio-api = "mira_api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mira_api*"]
