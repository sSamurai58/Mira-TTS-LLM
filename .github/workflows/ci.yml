name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-api:
    name: studio-api smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/studio-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/studio-api/pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Smoke Studio Path
        run: python scripts/smoke_path.py

  desktop:
    name: desktop typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Upload renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-desktop-renderer
          path: apps/desktop/dist
          if-no-files-found: error
