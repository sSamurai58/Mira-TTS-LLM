name: Release

on:
  push:
    tags:
      - "mira-v*"

permissions:
  contents: write

jobs:
  publish-linux:
    name: Publish Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --linux AppImage
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mira-linux-release
          path: apps/desktop/release/*.{AppImage,yml,yaml,blockmap}
          if-no-files-found: warn

  ci-gate:
    name: Pre-release CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: API smoke
        working-directory: services/studio-api
        run: |
          pip install -e .
          python scripts/smoke_path.py
      - name: Desktop typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
